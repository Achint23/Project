[project]
name = "docbot"
version = "0.1.0"
description = "Local Intelligent Document Query POC"
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit>=1.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
