[project]
name = "docbot"
version = "0.1.0"
description = "Local Intelligent Document Query POC"
requires-python = ">=3.10,<3.13"
dependencies = [
    "streamlit>=1.40",
    "openai>=1.50",
    "pydantic>=2.7",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "pymupdf>=1.24",
    "easyocr>=1.7.2",
    "onnxruntime>=1.17,<1.24",
    "chromadb>=0.5",
    "tiktoken>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
markers = [
    "integration: marks tests that require live API access",
]
